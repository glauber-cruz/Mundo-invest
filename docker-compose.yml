services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mundo-invest-app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      DATABASE_URL: postgresql+psycopg2://admin:admin123@db:5432/mundo-invest-db
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: mundo-invest-db
    environment:
      POSTGRES_DB: mundo-invest-db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
