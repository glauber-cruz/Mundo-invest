services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mundo-invest-app
    command: >
      sh -c "alembic upgrade head &&
             uvicorn main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      DATABASE_URL: postgresql+psycopg2://admin:admin123@db:5432/mundo_invest_db
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: mundo_invest_db
    environment:
      POSTGRES_DB: mundo_invest_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d mundo_invest_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
