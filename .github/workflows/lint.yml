name: Lint

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "**/*.md"
      - .example.env
  pull_request:
    paths-ignore:
      - "**/*.md"
      - .example.env

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: |
          python -m pip install --upgrade pip
          make install

      - run: make lint
